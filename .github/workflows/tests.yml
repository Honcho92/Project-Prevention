name: tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    defaults:
      run:
        # cross-platform: set PYTHONPATH via the env: block instead of shell prefix
        # so this works on both bash (Linux) and PowerShell (Windows)
        shell: bash

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show Python info
        run: |
          python --version
          python -c "import sys; print(sys.platform)"

      - name: Run the test suite
        env:
          PYTHONPATH: "."
        run: |
          python -m unittest discover -s tests -v 2>&1 | tail -50

      - name: Run the demo (Linux only — bash is the default shell)
        if: runner.os == 'Linux'
        env:
          PYTHONPATH: "."
        run: |
          python -m scam_shield demo
